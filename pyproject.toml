[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vadl"
version = "0.1.0"
description = "Vulnerability Assessment and Defense Lab (VADL) - Phase 1 Foundation"
readme = "README.md"
requires-python = ">=3.11, <3.13"
license = { text = "MIT" }
authors = [
    { name = "VADL Security Engineering Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Security",
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Flask==3.1.3",
    "Werkzeug==3.1.9",
    "Flask-SQLAlchemy==3.1.1",
    "SQLAlchemy==2.0.38",
    "Flask-Migrate==4.1.0",
    "alembic==1.14.1",
    "python-dotenv==1.2.4",
    "reportlab==5.1.0",
    "pillow==13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.9.9",
    "bandit==1.8.3",
    "pip-audit==2.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
exclude = [
    ".venv",
    "migrations",
    "instance",
    "reports",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.bandit]
exclude_dirs = [".venv", "instance", "reports", "tests"]
skips = ["B101"] # Skip assert checks in test suites if triggered
