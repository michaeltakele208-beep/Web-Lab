{% extends "base.html" %}

{% block title %}403 - Forbidden - Web Lab{% endblock %}

{% block content %}
<div class="error-container">
  <h1 style="color: var(--accent-red);">403</h1>
  <h2>Access Denied</h2>
  <p>{{ message or "Forbidden: You do not possess the required permissions to access this laboratory resource." }}</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn">Return to Dashboard</a>
</div>
{% endblock %}
